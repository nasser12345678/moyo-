[build]
  publish   = "legacy"
  functions = "netlify/functions"
  command   = "cd netlify/functions && npm install"

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

# Ensure all routes serve index.html (SPA-style hash routing)
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
